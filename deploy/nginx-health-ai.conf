# /etc/nginx/sites-available/health-ai.digitalbackoffice.co.uk
#   sudo ln -s /etc/nginx/sites-available/health-ai.digitalbackoffice.co.uk /etc/nginx/sites-enabled/
# First get a certificate:  sudo certbot certonly --nginx -d health-ai.digitalbackoffice.co.uk
# (or comment out the 443 block until you have one; certbot --nginx will then edit this file).

upstream health_ai_backend  { server 127.0.0.1:8000; keepalive 16; }
upstream health_ai_frontend { server 127.0.0.1:8080; }

server {
    listen 80;
    listen [::]:80;
    server_name health-ai.digitalbackoffice.co.uk;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name health-ai.digitalbackoffice.co.uk;

    ssl_certificate     /etc/letsencrypt/live/health-ai.digitalbackoffice.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/health-ai.digitalbackoffice.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-sent events (live session events) and the streamed LLM proxy: no buffering,
    # long read timeout.
    location ~ ^/(api/sessions/.+/events|v1)(/|$) {
        proxy_pass http://health_ai_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # ElevenLabs -> backend: tool webhooks, post-call + call-start webhooks, Vertex LLM proxy (/v1/...);
    # Twilio -> backend: SOS conference, reception transfers, browser calls (/twilio/...);
    # plus the browser API and health checks.
    location ~ ^/(api|tools|webhooks|twilio|healthz|readyz)(/|$) {
        proxy_pass http://health_ai_backend;
        proxy_read_timeout 60s;
    }

    # Staff API: restrict to your office / VPN IPs once you know them.
    location ^~ /api/admin/ {
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://health_ai_backend;
    }

    # React app
    location / {
        proxy_pass http://health_ai_frontend;
    }
}
